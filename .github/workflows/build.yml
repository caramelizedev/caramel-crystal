# Runs ./build on a hosted Apple Silicon runner, on request. The runner has
# 7 GB of memory and the build peaked between 5.5 and 8.4 GiB in three runs
# on a 36 GB machine, so it may not fit: the first run is the trial, and the
# step prints the build's time and peak memory.
name: build

on: workflow_dispatch

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: /usr/bin/time -l ./build "$RUNNER_TEMP/work"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
